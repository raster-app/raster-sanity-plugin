name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The package's npm trusted publisher names this environment, so npm accepts a publish only
    # from it. Its deployment branch policy limits releases to main.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install -g npm@latest pnpm@12.6.0

      - run: pnpm install --frozen-lockfile

      # prepublishOnly builds it. The repo is public, so npm adds provenance.
      - run: npm publish
